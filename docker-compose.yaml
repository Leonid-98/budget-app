services:
  app:
    image: ghcr.io/leonid-98/budget-app:latest
    container_name: budget-app
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  # Local testing only: docker compose --profile local up --build app-local
  # No reverse proxy locally, so MOCK_AUTH_EMAIL stands in for oauth2-proxy —
  # switch it to the other email to test as Аня. Never set it in production.
  app-local:
    profiles: ["local"]
    build: .
    container_name: budget-app-local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data-local:/data
    environment:
      MOCK_AUTH_EMAIL: user1@example.com
