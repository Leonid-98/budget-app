<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budget App — Calculator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="calculator">
    <h1>Calculator</h1>
    <form id="calc-form">
      <input type="number" id="a" step="any" placeholder="First number" required>
      <select id="operator" aria-label="Operator">
        <option value="+">+</option>
        <option value="-">−</option>
        <option value="*">×</option>
        <option value="/">÷</option>
      </select>
      <input type="number" id="b" step="any" placeholder="Second number" required>
      <button type="submit">Calculate</button>
    </form>
    <p id="output" role="status"></p>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
